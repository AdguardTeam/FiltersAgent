# The `filters-agent` action face of the shared agent entry point.
#
# The action runs as a Docker container action over `action.Dockerfile`, which carries the
# sources, `node_modules` and both browsers; the image boots `src/action/action-main.ts` through
# tsx. There are deliberately no `default:` expressions in this metadata: the input names mirror
# `src/action/action-input-binding.ts` one-to-one, and the runtime-side fallbacks
# (`GITHUB_REPOSITORY`, the workspace, the container artifacts directory) are applied by the
# binding, so this file and the binding cannot diverge. Inputs reach the container as `INPUT_*`
# variables read in Node; the token never passes through a shell.
name: 'filters-agent'
description: >-
    Analyzes a reported filtering issue or the open-issue backlog of this repository, verifies
    proposed rules in the AdGuard extension, and posts the report as an issue comment; run
    artifacts are published by the workflow through the outputs below. The LLM inputs are
    mandatory and come from repository secrets.

inputs:
    repository:
        description: >-
            Repository slug (owner/repo) the run identifies itself with; defaults to the runner's
            GITHUB_REPOSITORY.
        required: false
    issueNumber:
        description: >-
            Number of the issue to analyze; selecting it runs the single-issue mode.
        required: false
    backlog:
        description: >-
            'true' analyzes the repository's open-issue backlog instead of a single issue.
        required: false
    limit:
        description: >-
            Maximum number of backlog issues analyzed per run; unset means up to 50 issues in one
            job, each a paid LLM run; the loop also stops at its wall-clock budget (default 5 h 30
            min, overridable by an input) so one job stays under GitHub's 6-hour cap.
        required: false
    excludedLabels:
        description: >-
            Comma-separated issue labels the action never processes, for example 'NSFW'. An issue
            carrying one is skipped before its page is opened, in the single-issue and the backlog
            mode alike, and a report stays unposted when such a label is added during the run.
            Labels compare case-insensitively; unset excludes none.
        required: false
    inProgressLabels:
        description: >-
            Comma-separated labels a maintainer applies when they pick an issue up, for example
            'A: In progress'. An issue carrying one counts as a maintainer already on it: the run is
            skipped, and a report stays unposted when such a label is added during the run, unless
            the run is forced. Labels compare case-insensitively; unset names none.
        required: false
    reportBots:
        description: >-
            Comma-separated GitHub logins of bots that file issues or post reports for a reporting
            tool, for example 'adguard-bot'. Their comments are kept out of the model's input and
            never count as a maintainer on the issue, even when GitHub stamps them MEMBER. Accounts
            GitHub marks as bots need no listing; unset names none.
        required: false
    trustedRoles:
        description: >-
            Comma-separated GitHub author associations trusted to change a backlog issue's revision,
            and whose comment on an issue keeps the report silent as a maintainer already on it;
            defaults to OWNER,MEMBER,COLLABORATOR.
        required: false
    maxRevisionsPerWindow:
        description: >-
            Maximum revision-marked reports one backlog issue may receive inside the rolling
            revisionWindowMs window; defaults to the queue's revision budget.
        required: false
    revisionWindowMs:
        description: >-
            Length of the rolling window the revision budget counts against, in milliseconds;
            defaults to the queue's revision window (24 hours).
        required: false
    backlogWallClockBudgetMs:
        description: >-
            Wall-clock budget for the whole backlog loop, in milliseconds; defaults to 5 h 30 min so
            one job stays under GitHub's 6-hour cap. The loop stops taking new issues once the
            remaining time can no longer fit one more issue's own investigation budget.
        required: false
    executors:
        description: >-
            Comma-separated executor names the analysis session may use: 'browser_extension' (the
            built-in AdGuard Browser Extension), the executor of any module blockerModules plugs
            in, or several; empty means 'browser_extension' alone.
        required: false
    blockerModules:
        description: >-
            Manifests of the blocker modules to plug in, one per line or comma-separated, relative
            to the workspace. Each manifest names its executor, the command that starts it, and the
            environment variables it needs; set those in the step's env, from secrets.
        required: false
    instructionPath:
        description: >-
            Path of the run instruction file, relative to the checkout; when unset, the checkout's
            default instruction at .github/filters-agent/AGENTS.md is loaded when present.
        required: false
    artifactsDir:
        description: >-
            Directory the run writes its artifacts to; defaults to filters-agent-artifacts/artifacts
            under the checkout.
        required: false
    model:
        description: >-
            Reasoning-model slug overriding the LLM runtime's configured model.
        required: false
    noComment:
        description: >-
            'true' skips posting the report as an issue comment; the report is still written to the
            artifacts directory.
        required: false
    force:
        description: >-
            'true' for a run a maintainer triggered, by label or by a manual dispatch: a
            maintainer's comment, an assignee or an in-progress label on the issue no longer skips the
            run or keeps the report silent. A closed issue, a fix referenced, an excluded label and a report already
            posted for the issue's current text still do. The backlog mode ignores it.
        required: false
    screenshotsBranch:
        description: >-
            Branch the before and after screenshots of a verified rule are committed to, so the
            report comment can show them; defaults to filters-agent-screenshots. Needs the
            `contents: write` permission; without it the report posts without screenshots.
        required: false
    lintCommand:
        description: >-
            The repository's own lint command line, for example 'npx aglint'. The action writes each
            candidate rule to a temporary file in the directory of its target list and runs the
            command in the checkout with that file's path appended; a failure only adds a note to
            the report. Install the linter in a step before the action. Unset runs no lint.
        required: false
    checkoutPath:
        description: >-
            Path of the analyzed checkout; defaults to the runner's GITHUB_WORKSPACE.
        required: false
    githubToken:
        description: >-
            GitHub API token the run reads issues with; in practice mandatory in every run, since the
            action only serves GitHub-read modes — a missing token fails the job named, even together
            with noComment.
        required: false
    llmBaseUrl:
        description: >-
            OpenAI-compatible API base URL of the LLM provider.
        required: true
    llmApiKey:
        description: >-
            API key of the LLM provider; pass it from a repository secret.
        required: true
    llmModel:
        description: >-
            Default reasoning-model slug for the run's LLM sessions.
        required: true
    llmVisionModel:
        description: >-
            Model slug used for vision steps that read screenshots.
        required: true
    llmContextWindowTokens:
        description: >-
            Context window of the reasoning model, in tokens, as your provider states it. No
            default: a run without it fails at start, before it spends anything.
        required: true
    llmMaxOutputTokens:
        description: >-
            Completion cap sent with the reasoning model's requests, in tokens: the model's own
            limit at your provider. No default: a run without it fails at start, before it spends
            anything.
        required: true
    llmVisionMaxOutputTokens:
        description: >-
            Completion cap sent with the vision model's requests, in tokens. Required when
            llmVisionModel names a different model than llmModel; when both name one model it is
            llmMaxOutputTokens.
        required: false
    llmReasoningEffort:
        description: >-
            Reasoning effort of the investigation's requests: off, minimal, low, medium or high;
            defaults to high. Set it to off for a model that does not reason, so no reasoning
            parameter is sent.
        required: false
    llmSingleShotReasoningEffort:
        description: >-
            Reasoning effort of the one-question calls (reading the issue, describing a
            screenshot): off, minimal, low, medium or high; defaults to low.
        required: false
    llmRequestMaxAttempts:
        description: >-
            Total attempts per LLM request when the provider fails transiently (a 5xx, a timeout, a
            response cut off mid-stream), 1 to 3; defaults to 2. Raise it to 3 for a gateway that
            drops responses more than once in a row.
        required: false
    llmProviderRouting:
        description: >-
            JSON routing preferences for an OpenRouter-compatible gateway, sent as the `provider`
            object on every request — for example {"ignore":["Together"]} to route around a faulting
            upstream provider. Plain configuration, not a secret; leave it unset for a gateway that
            does not understand the field.
        required: false

outputs:
    artifacts-dir:
        description: >-
            Directory the run wrote its artifacts to, relative to the checkout; feed it to
            actions/upload-artifact.
    status:
        description: >-
            How the run sealed: success, partial_failure (backlog runs with per-issue failures), or
            failed.

runs:
    using: 'docker'
    image: 'action.Dockerfile'
